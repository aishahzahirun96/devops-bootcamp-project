name: Publish README

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - .github/workflows/pages.yml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare README as homepage
        run: |
          mkdir -p _pages

          # Kunci Custom Domain supaya tidak terpadam semasa build
          echo "readme.aishahzahirun.asia" > _pages/CNAME

          {
            echo "---"
            echo "title: DevOps Bootcamp Project"
            echo "---"
            cat README.md
          } > _pages/index.md

          if [ -d docs ]; then
            cp -r docs _pages/docs
          fi

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: _pages
          destination: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5